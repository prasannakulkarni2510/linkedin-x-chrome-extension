      <script>
        const tl = gsap.timeline({ paused: true });
        const D = 8;
        const F = 1 / 60;

        tl.fromTo("#install-glow", { scale: 0.94 }, { scale: 1.08, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#install-dots", { x: 0, y: 0 }, { x: 24, y: -18, duration: D, ease: "none" }, 0);
        tl.fromTo("#install-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);

        // Waterfall entry: binary reveal, whip up from below, overlapping; the last word travels furthest.
        const words = [
          ["#install-w1", 80, 0.2],
          ["#install-w2", 45, 0.15],
          ["#install-w3", 40, 0.14],
          ["#install-w4", 50, 0.15],
          ["#install-w5", 75, 0.18],
        ];
        let t = 0.15;
        words.forEach(([sel, y, dur], i) => {
          tl.set(sel, { opacity: 1, y }, t);
          tl.to(sel, { y: 0, duration: dur, ease: "power4.out" }, t);
          t += dur - (i === 0 ? -2 * F : F);
        });
        tl.fromTo("#install-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.9);

        // Steps arrive one per beat, each confirmed by a check that pops on.
        const rowStarts = [1.1, 2.1, 3.1, 4.1];
        rowStarts.forEach((s, i) => {
          const n = i + 1;
          tl.set("#install-row-" + n, { opacity: 1, y: 60 }, s);
          tl.to("#install-row-" + n, { y: 0, duration: 0.32, ease: "power4.out" }, s);
          tl.fromTo("#install-check-" + n, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, s + 0.6);
        });

        tl.set("#install-foot", { opacity: 1, y: 40 }, 5.3);
        tl.to("#install-foot", { y: 0, duration: 0.3, ease: "power4.out" }, 5.3);

        window.__timelines["install"] = tl;
