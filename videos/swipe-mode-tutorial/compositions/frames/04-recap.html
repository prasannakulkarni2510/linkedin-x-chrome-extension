          <div data-hf-id="hf-1tc3" class="recap-card"><div data-hf-id="hf-iw8j" class="recap-cap">S</div><div data-hf-id="hf-yi5u" class="recap-name">Save</div></div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const D = 8;

        tl.fromTo("#recap-glow", { scale: 0.94 }, { scale: 1.06, duration: D / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo("#recap-dots", { x: 0, y: 0 }, { x: 26, y: 20, duration: D, ease: "none" }, 0);
        tl.fromTo("#recap-ghost", { x: -20 }, { x: 40, duration: D, ease: "none" }, 0);

        tl.fromTo("#recap-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo("#recap-head-1", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.15);
        tl.fromTo("#recap-head-2", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, 0.35);

        // Grid assemble: each card slides a short way into its own slot, row by row.
        tl.fromTo(".recap-card", { opacity: 0, y: 46, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 0.6);
        tl.fromTo(".recap-cap", { scale: 0.7 }, { scale: 1, duration: 0.5, ease: "back.out(2.2)", stagger: 0.08 }, 0.7);

        tl.fromTo("#recap-close", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.0);
        tl.fromTo("#recap-note", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 2.5);

        // Hold: the whole grid floats gently; a final fade closes the film.
        tl.fromTo("#recap-grid", { y: 0 }, { y: -10, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.6);
        tl.fromTo("#root", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power1.in" }, D - 0.6);

        window.__timelines["recap"] = tl;
      </script>
