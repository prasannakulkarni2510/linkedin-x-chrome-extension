        <div data-hf-id="hf-iafi" id="v3-cap-2" class="cap">This is Swipe Mode.</div>
        <div data-hf-id="hf-hy22" id="v3-cap-3" class="cap">Your LinkedIn feed and your X timeline,</div>
        <div data-hf-id="hf-vv6g" id="v3-cap-4" class="cap">one post at a time.</div>
        <div data-hf-id="hf-9hmq" id="v3-cap-5" class="cap">Press Alt, Shift, S to start.</div>
        <div data-hf-id="hf-tbvr" id="v3-cap-6" class="cap">Every post gets the whole card.</div>
        <div data-hf-id="hf-wrfc" id="v3-cap-7" class="cap">Left skips it.</div>
        <div data-hf-id="hf-ff2r" id="v3-cap-8" class="cap">U brings it back.</div>
        <div data-hf-id="hf-x1kb" id="v3-cap-9" class="cap">Right shows your options.</div>
        <div data-hf-id="hf-xigs" id="v3-cap-10" class="cap">Nothing happens until you choose.</div>
        <div data-hf-id="hf-86o4" id="v3-cap-11" class="cap">R and a number reacts.</div>
        <div data-hf-id="hf-90mo" id="v3-cap-12" class="cap">S saves the post.</div>
        <div data-hf-id="hf-p8uy" id="v3-cap-13" class="cap">If LinkedIn doesn't confirm,</div>
        <div data-hf-id="hf-doh0" id="v3-cap-14" class="cap">Swipe Mode tells you, and marks nothing done.</div>
        <div data-hf-id="hf-wd52" id="v3-cap-15" class="cap">On X, it's the same keys.</div>
        <div data-hf-id="hf-o8zo" id="v3-cap-16" class="cap">R likes.</div>
        <div data-hf-id="hf-jizv" id="v3-cap-17" class="cap">S bookmarks.</div>
        <div data-hf-id="hf-lhci" id="v3-cap-18" class="cap">And X's own shortcuts stay out of the way.</div>
        <div data-hf-id="hf-jwwf" id="v3-cap-19" class="cap">Now, the new part.</div>
        <div data-hf-id="hf-nm1d" id="v3-cap-20" class="cap">Press P on any post.</div>
        <div data-hf-id="hf-qc6o" id="v3-cap-21" class="cap">Replies load with their profile pictures.</div>
        <div data-hf-id="hf-qx0a" id="v3-cap-22" class="cap">Pick them by number.</div>
        <div data-hf-id="hf-mc6n" id="v3-cap-23" class="cap">R drops one you don't want, and the next takes its place.</div>
        <div data-hf-id="hf-em24" id="v3-cap-24" class="cap">Enter saves a square image,</div>
