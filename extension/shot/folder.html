<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot folder</title>
  <link rel="stylesheet" href="folder.css">
</head>
<body>
  <main>
    <h1 id="title">Where should screenshots go?</h1>
    <p id="lead">Pick a folder once. Every tweet screenshot is saved there from now on, without asking again.</p>
    <div class="buttons">
      <button id="allow" type="button" class="primary" hidden>Allow</button>
      <button id="choose" type="button" class="primary">Choose folder</button>
      <button id="close" type="button" hidden>Close</button>
    </div>
    <p id="status" role="status"></p>
    <p class="keys"><kbd>Enter</kbd> press the highlighted button · <kbd>Tab</kbd> next button · <kbd>Esc</kbd> close</p>
  </main>
  <script src="../src/core/folder-store.js"></script>
  <script src="folder.js"></script>
</body>
</html>
